<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV数据分析处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.2em;
            font-weight: 300;
        }

        .upload-section {
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .file-input {
            display: none;
        }

        .file-info {
            margin-top: 15px;
            color: #666;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .date-input {
            padding: 12px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .date-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .generate-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: auto;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3);
        }

        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .filter-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .filter-info h3 {
            margin-bottom: 10px;
            color: #6c5ce7;
        }

        .filter-info ul {
            margin-left: 20px;
        }

        .filter-info li {
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .generate-btn {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSV数据分析处理工具</h1>
        
        <div class="filter-info">
            <h3>筛选条件说明</h3>
            <ul>
                <li>检测分数：低于70分</li>
                <li>数量值：等于200</li>
                <li>单价：等于10元</li>
                <li>烹饪方式：西餐</li>
                <li>日期：指定日期或今日</li>
            </ul>
        </div>

        <div class="upload-section">
            <button class="upload-btn" onclick="document.getElementById('csvFile').click()">
                📁 选择CSV文件
            </button>
            <input type="file" id="csvFile" class="file-input" accept=".csv" onchange="handleFileSelect(event)">
            <div class="file-info" id="fileInfo">请选择一个CSV文件</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="filterDate">筛选日期 (留空为今日):</label>
                <input type="date" id="filterDate" class="date-input">
            </div>
            <button class="generate-btn" id="generateBtn" onclick="generateResult()" disabled>
                🚀 生成结果
            </button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        let csvData = [];
        let csvHeaders = [];
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const fileInfo = document.getElementById('fileInfo');
            const generateBtn = document.getElementById('generateBtn');
            
            fileInfo.textContent = `已选择: ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    parseCSV(e.target.result);
                    generateBtn.disabled = false;
                    showStatus('文件加载成功！共读取 ' + csvData.length + ' 行数据', 'success');
                } catch (error) {
                    showStatus('文件解析失败: ' + error.message, 'error');
                    generateBtn.disabled = true;
                }
            };
            reader.readAsText(file, 'utf-8');
        }
        
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) {
                throw new Error('CSV文件格式不正确，至少需要标题行和一行数据');
            }
            
            // 解析标题行
            csvHeaders = parseCSVLine(lines[0]);
            
            // 解析数据行
            csvData = [];
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim()) {
                    const row = parseCSVLine(lines[i]);
                    if (row.length === csvHeaders.length) {
                        const dataObj = {};
                        csvHeaders.forEach((header, index) => {
                            dataObj[header.trim()] = row[index].trim();
                        });
                        csvData.push(dataObj);
                    }
                }
            }
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current);
            return result;
        }
        
        function generateResult() {
            if (csvData.length === 0) {
                showStatus('请先上传CSV文件', 'error');
                return;
            }
            
            try {
                const filterDate = document.getElementById('filterDate').value || getTodayString();
                const filteredData = filterData(filterDate);
                
                if (filteredData.length === 0) {
                    showStatus('没有找到符合筛选条件的数据', 'info');
                    return;
                }
                
                downloadCSV(filteredData, generateFileName());
                showStatus(`成功生成结果文件！共筛选出 ${filteredData.length} 条数据`, 'success');
                
            } catch (error) {
                showStatus('生成结果时出错: ' + error.message, 'error');
            }
        }
        
        function filterData(targetDate) {
            return csvData.filter(row => {
                // 检查所有可能的字段名称（支持中英文）
                const score = getFieldValue(row, ['检测分数', '分数', 'score', '评分']);
                const quantity = getFieldValue(row, ['数量', '数量值', 'quantity', 'amount']);
                const price = getFieldValue(row, ['单价', '价格', 'price', '金额']);
                const cookingStyle = getFieldValue(row, ['烹饪方式', '料理方式', 'cooking_style', 'cuisine', '菜系']);
                const date = getFieldValue(row, ['日期', 'date', '时间', 'time']);
                
                // 转换数值
                const scoreNum = parseFloat(score);
                const quantityNum = parseFloat(quantity);
                const priceNum = parseFloat(price);
                
                // 检查筛选条件
                const scoreMatch = !isNaN(scoreNum) && scoreNum < 70;
                const quantityMatch = !isNaN(quantityNum) && quantityNum === 200;
                const priceMatch = !isNaN(priceNum) && priceNum === 10;
                const cookingMatch = cookingStyle && (
                    cookingStyle.includes('西餐') || 
                    cookingStyle.toLowerCase().includes('western') ||
                    cookingStyle.toLowerCase().includes('western cuisine')
                );
                const dateMatch = date && formatDate(date) === targetDate;
                
                return scoreMatch && quantityMatch && priceMatch && cookingMatch && dateMatch;
            });
        }
        
        function getFieldValue(row, possibleKeys) {
            for (const key of possibleKeys) {
                if (row.hasOwnProperty(key)) {
                    return row[key];
                }
                // 尝试不区分大小写的匹配
                const lowerKey = key.toLowerCase();
                for (const rowKey in row) {
                    if (rowKey.toLowerCase() === lowerKey) {
                        return row[rowKey];
                    }
                }
            }
            return '';
        }
        
        function formatDate(dateStr) {
            // 尝试解析各种日期格式
            const date = new Date(dateStr);
            if (!isNaN(date.getTime())) {
                return date.toISOString().split('T')[0];
            }
            
            // 如果直接解析失败，尝试其他格式
            const formats = [
                /(\d{4})-(\d{2})-(\d{2})/,  // YYYY-MM-DD
                /(\d{4})\/(\d{2})\/(\d{2})/, // YYYY/MM/DD
                /(\d{2})\/(\d{2})\/(\d{4})/, // MM/DD/YYYY
                /(\d{2})-(\d{2})-(\d{4})/   // MM-DD-YYYY
            ];
            
            for (const format of formats) {
                const match = dateStr.match(format);
                if (match) {
                    let year, month, day;
                    if (format === formats[0] || format === formats[1]) {
                        [, year, month, day] = match;
                    } else {
                        [, month, day, year] = match;
                    }
                    return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
                }
            }
            
            return dateStr;
        }
        
        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }
        
        function generateFileName() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            return `${year}${month}${day}${hours}${minutes}${seconds}_result.csv`;
        }
        
        function downloadCSV(data, filename) {
            // 创建CSV内容
            let csvContent = csvHeaders.join(',') + '\n';
            
            data.forEach(row => {
                const rowData = csvHeaders.map(header => {
                    const value = row[header] || '';
                    // 如果值包含逗号或引号，需要用引号包围
                    if (value.includes(',') || value.includes('"') || value.includes('\n')) {
                        return '"' + value.replace(/"/g, '""') + '"';
                    }
                    return value;
                });
                csvContent += rowData.join(',') + '\n';
            });
            
            // 创建Blob并下载
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            
            // 自动清除成功消息
            if (type === 'success') {
                setTimeout(() => {
                    status.textContent = '';
                    status.className = '';
                }, 5000);
            }
        }
        
        // 设置默认日期为今天
        document.getElementById('filterDate').value = getTodayString();
    </script>
</body>
</html>
